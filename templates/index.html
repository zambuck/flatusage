<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>flatusage TOU Calculator</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1rem;
      line-height: 1.5;
    }
    h1 { color: #1a1a1a; }
    label {
      display: block;
      margin-top: 1.2rem;
      font-weight: 500;
    }
    input[type="file"], input[type="text"] {
      display: block;
      margin-top: 0.3rem;
      width: 100%;
      max-width: 420px;
    }
    input[type="file"] {
      font-size: 150%;
    }
    button {
      margin-top: 1.5rem;
      padding: 0.7rem 1.5rem;
      font-size: 1rem;
      cursor: pointer;
    }
    .info {
      margin-top: 0.4rem;
      color: #555;
      font-size: 0.95rem;
    }
    .plan-name {
      color: #0969da;
      font-weight: 600;
    }
    .warning {
      color: #9a6700;
      background: #fff8c5;
      border: 1px solid #eedf6b;
      border-radius: 4px;
      padding: 0.6rem 0.8rem;
      margin-top: 0.4rem;
    }
    #spinner {
      display: none;
      margin-top: 1rem;
      color: #555;
    }
    #error {
      margin-top: 1rem;
      color: #cf222e;
    }
    .comparison {
      margin-top: 1.5rem;
      background: #f6f8fa;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      padding: 1rem;
    }
    .comparison table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 0.5rem;
    }
    .comparison th, .comparison td {
      border: 1px solid #d0d7de;
      padding: 0.5rem;
      text-align: left;
    }
    .comparison th {
      background: #eaeef2;
    }
    .cheaper { color: #1a7f37; font-weight: 600; }
    .config-block {
      margin-top: 1.5rem;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      padding: 1rem;
    }
    .config-block h3 {
      margin-top: 0;
    }
    .downloads {
      margin: 0.8rem 0;
    }
    .downloads a {
      display: inline-block;
      margin: 0.3rem 0.4rem 0 0;
      padding: 0.4rem 0.8rem;
      background: #2ea44f;
      color: white;
      text-decoration: none;
      border-radius: 4px;
    }
    .downloads a.zip {
      background: #0969da;
    }
    .console-output {
      margin-top: 1rem;
      background: #f6f8fa;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      padding: 1rem;
      white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.85rem;
      max-height: 500px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <h1>flatusage TOU Calculator</h1>

  <form id="calcForm">
    <label>
      Usage CSV (e.g. MyUsageData.csv)
      <input type="file" id="usageFile" name="usage_csv" accept=".csv" required>
    </label>
    <div id="dateRange" class="info" style="display: none;"></div>

    <label>
      Tariff config YAML
      <input type="file" id="config1File" name="tariff_yaml" accept=".yaml,.yml" required>
    </label>
    <div id="plan1" class="info" style="display: none;"></div>

    <label>
      Comparison tariff config YAML (optional)
      <input type="file" id="config2File" name="tariff_yaml_2" accept=".yaml,.yml">
    </label>
    <div id="plan2" class="info" style="display: none;"></div>
    <div id="dupWarning" style="display: none;"></div>

    <label>
      Register (optional — leave blank for combined E1/E2)
      <input type="text" name="register" placeholder="E1">
    </label>

    <button type="submit">Calculate</button>
    <div id="spinner">Running calculation… please wait.</div>
  </form>

  <div id="error"></div>
  <div id="results"></div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
